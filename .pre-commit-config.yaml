---
repos:
  - repo: local
    hooks:
      # Format Nix files with the formatter.
      - id: nixfmt
        name: Format Nix files
        language: system
        entry: nix fmt
        files: .*\.nix$

      # Strip EXIF metadata from images.
      - id: nixfmt
        name: Format Nix files
        language: system
        entry: exiftool -all=
        types: [image]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.14.9
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        types:
          - file
        files: \.(md|qmd)$
        additional_dependencies:
          # Allow configuration of mdformat via pyproject.toml.
          - mdformat-pyproject

          # Correctly parse and format frontmatter.
          - mdformat-front-matters

          # Support certain Markdown extensions such as tables.
          - mdformat-gfm

          # Format Python code blocks with Ruff.
          - mdformat-ruff
